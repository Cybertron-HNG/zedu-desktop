name: Integration checks

# zedu-hng's own PR checks and scans, run on PRs into our team branch (cybertron-integration),
# so whatever we bundle and send to zedu-hng has already passed the same checks there.
# Calls zedu-ci's reusable workflows at the same commit zedu-hng/zedu-desktop pins in its
# .github/workflows/pr-checks.yml and pr-scans.yml. To follow a zedu-ci update, change the SHA in
# both "uses:" lines to the one zedu-hng/zedu-desktop uses.
#
# Backend dependency: fails while the PR description has a "Backend URL:" line, meaning the PR
# needs backend work that isn't on dev yet. Don't merge it into cybertron-integration until that
# backend is on dev and the line is removed.
#
# Safe for member PRs: runs PR code only with a read-only token and no secrets.
# Delete this file (with any other team-only workflow) before opening the bundle PR to zedu-hng,
# or zedu-hng's "Protected files" check fails on the .github/ change.

on:
  pull_request:
    branches:
      - cybertron-integration
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
      - edited

permissions: {}

jobs:
  checks:
    name: PR checks
    if: github.event.action != 'edited'
    concurrency:
      group: integration-checks-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    permissions:
      contents: read
    uses: zedu-hng/zedu-ci/.github/workflows/pr-checks-flutter.yml@181371c60af0e32605794c6f0c4520f1ef739271

  scans:
    name: PR scans
    if: github.event.action != 'edited'
    concurrency:
      group: integration-scans-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    permissions:
      contents: read
    uses: zedu-hng/zedu-ci/.github/workflows/pr-scans.yml@181371c60af0e32605794c6f0c4520f1ef739271
    with:
      clamav_exclude_dirs: build .dart_tool android/.gradle ios/Pods macos/Pods

  backend-dependency:
    name: Backend dependency
    runs-on: ubuntu-latest
    permissions: {}
    env:
      BODY: ${{ github.event.pull_request.body }}
    steps:
      - name: Check for a Backend URL line
        run: |
          line=$(printf '%s\n' "$BODY" | tr -d '\r' | grep -iE '^[[:space:]]*backend url:' | head -1 || true)
          if [ -n "$line" ]; then
            echo "::error::This PR depends on backend work that isn't on dev yet ($line). Don't merge it into cybertron-integration until that backend is on dev and the line is removed from the description."
            exit 1
          fi
          echo "No Backend URL line: the PR uses the dev backend."
